# data_source: "local" (data_dir below only), "sid_set_stream" (SID_Set
# streamed from the HF Hub only, no data_dir needed), or "mixed" (both,
# concatenated -- the default, see detector/data_sources/mixed.py and
# experiments.md section 5 for why).
data_source: mixed
sid_set_train_shards: 10
sid_set_val_shards: 1

data_dir: ../Data/train
output_dir: runs/latest

seed: 2026
validation_fraction: 0.20

batch_size: 16
epochs: 5
learning_rate: 0.00001
weight_decay: 0.01
num_workers: 0

# Fraction of training samples that get one randomly-severity JPEG
# re-encode / blur / noise / resize-roundtrip corruption applied before
# the usual crop/flip/color-jitter augmentation (see
# detector/transforms.py's _RandomRobustnessAugment). 0 disables it.
# Added to close a measured robustness gap: blur_sigma2 dropped to ~60%
# accuracy and noise_sigma0.05/0.10 missed ~49% of AI images at eval time
# with this at 0, on both the held-out validation split and Data/test.
train_augment_probability: 0.7

threshold: 0.50
pretrained: true
local_files_only: false
