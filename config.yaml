# === TikTok TechJam PS5 detector -- iteration config ===
# Machine: Intel Arc iGPU (XPU, torch 2.6.0+xpu venv at C:\Users\attil\ttj-venv26),
# public data only. See experiments.md section 9 for the environment pivot.
#
# This file reproduces the iteration-4 baseline: Community Forensics ViT-S,
# organiser Final Score 0.9126 on the resolution-matched WildFake+COCO set.
# The hybrid + frozen-CLIP branch (experiments.md 9l) is trained separately
# via the fusion-head path -- see scratchpad/train_fusion.py -- because the
# CLIP forward is too slow to run live in the training loop on this iGPU.

data_source: local
# iter4: iter3_train (SID full_synthetic + 17 DRAGON generators) +
# Community-Forensics-Small (many latent-diffusion + GAN generators; real from
# LAION/ImageNet/CelebA/COCO, perceptual-hash deduped against the eval set by
# scratchpad/build_iter4.py). No pixel-space diffusion in training, so the
# organiser score stays a genuine cross-generator test.
data_dir: C:/Users/attil/ttj-data/iter4_train
output_dir: runs/iter4

# model_type: "vit" (Community Forensics alone) or "hybrid" (+ branches chosen
# by branch_kind: comma-separated from clip / wavelet / fft).
model_type: vit
# For the hybrid: model_type: hybrid, branch_kind: clip, vit_checkpoint: runs/iter4/best.pt
# branch_kind: clip
# vit_checkpoint: runs/iter4/best.pt

seed: 2026
validation_fraction: 0.12

batch_size: 16
epochs: 10
learning_rate: 0.00002
weight_decay: 0.01
num_workers: 8

# iter4_train is ~61k images. Each epoch draws a fresh class-balanced 24k
# from the pool (~7 min/epoch on the Arc iGPU).
samples_per_epoch: 24000

train_augment_probability: 0.8

# --- preprocessing / SAFE augmentations ---
# crop_from_native: skip Resize(256), RandomCrop(224) from native pixels
#   (SAFE / slide 10: resize low-pass-filters the artifact away).
crop_from_native: false
# safe_augment: RandomRotation(180) + RandomMask 16px patches up to 75% (SAFE).
safe_augment: false

# --- objective alignment (experiments.md 9c-9h) ---
select_metric: roc_auc
loss_pos_weight: 1.0
balance_classes: true
lr_schedule: cosine
warmup_frac: 0.1
# threshold: after training, run
#   python -m detector.calibrate runs/iter4/best.pt --genval <dir> --calval <dir> --rule minmax_fpfn --apply
# to fit the operating point on withheld generators. "auto" keeps the
# in-loop noise-aware value until then.
threshold: auto

pretrained: true
local_files_only: false
