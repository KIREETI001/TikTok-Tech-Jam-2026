# === TikTok TechJam PS5 -- training configuration ===
#
# This file, as committed, is the exact configuration that produced the
# shipped detector: organiser Final Score 0.9362 (clean AUC 0.9597 / robust
# AUC 0.9127) on the resolution-matched WildFake+COCO composition.
#
#   1. python scripts/build_corpus.py           -> ../detector_data/
#   2. python pipeline.py train --config config.yaml   -> runs/detector/
#   3. cp runs/detector/best.pt checkpoints/detector.pt
#
# The two settings that matter most are crop_from_native and safe_augment
# (both true, below). Training on native-resolution crops rather than
# downsampled images is what preserves the high-frequency artifact, and it
# is worth more than any architectural addition we tested -- see
# docs/EXPERIMENTS_LOG.md for the full ablation record, including the
# wavelet and frozen-CLIP branches that were measured and dropped.

data_source: local
data_dir: ../detector_data/train
output_dir: runs/detector

model_type: vit

seed: 2026
validation_fraction: 0.12

batch_size: 16
# 10, matching iter4/iter7's own recipe scale -- a fresh ViT run on a
# comparably-sized corpus (66.5k vs their ~61k).
epochs: 10
learning_rate: 0.00002
weight_decay: 0.01
num_workers: 4

# 66,502 images across a 40:60 real:fake split -- balance_classes handles
# the skew; samples_per_epoch matches iter4's own fixed 24k-per-epoch draw
# rather than a full-pool epoch (66.5k would be an unusually long epoch on
# this GPU otherwise).
samples_per_epoch: 24000

train_augment_probability: 0.8

# --- preprocessing / SAFE augmentations (slide 10) ---
crop_from_native: true
safe_augment: true

# --- objective alignment ---
select_metric: roc_auc
loss_pos_weight: 1.0
balance_classes: true
lr_schedule: cosine
warmup_frac: 0.1
threshold: auto

pretrained: true
local_files_only: false
