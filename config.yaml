# "local" reads data_dir below (external data is deliberately outside the
# Git repository). "sid_set_stream" instead streams the SID_Set dataset
# from the Hugging Face Hub over HTTP -- no local data_dir needed; see
# detector/data_sources/sid_set_stream.py. Uncomment to switch:
data_source: local
# data_source: sid_set_stream
# sid_set_train_shards: 13
# sid_set_val_shards: 1

data_dir: ../Data/train
output_dir: runs/latest

seed: 2026
validation_fraction: 0.20

batch_size: 16
epochs: 5
learning_rate: 0.00001
weight_decay: 0.01
num_workers: 0

threshold: 0.50
pretrained: true
local_files_only: false
