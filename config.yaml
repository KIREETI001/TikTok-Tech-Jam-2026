# === TikTok TechJam PS5 detector -- iteration 5a config ===
# Machine: this device (CUDA, RTX 3050 4GB laptop).
#
# Not a warm start from runs/iter4/best.pt: despite the teammate's commit
# message ("Track model checkpoints in git"), .gitignore excludes runs/ and
# *.pt/*.pth, so no checkpoint actually made it into the repo -- confirmed
# absent on this device. scratchpad/build_iter4.py was likewise never
# committed (private, machine-local). Training from the pretrained
# Community Forensics backbone instead, same as every prior run in this
# project, on a locally-rebuilt corpus (scripts/build_iter5_corpus.py)
# reconstructed from the teammate's documented iter3_train recipe
# (experiments.md 9d/9g) plus GenImage ADM/GLIDE for the pixel-space
# diffusion gap this project's own WildFake benchmark found (section 11).
#
# Sequenced deliberately as vit-only first, hybrid second (iteration 5b,
# once this run's checkpoint exists to warm-start from): the hybrid
# architecture's own history in this project (section 8) showed a
# frequency/wavelet branch needs an already-validated ViT base to fuse
# against, not a fresh pretrained one -- fusing against a fresh base
# reproduced the exact "predicts real 100% of the time" failure this
# project already diagnosed and fixed once.

data_source: local
data_dir: ../iter5_data/train
output_dir: runs/iter5a

model_type: vit
# iteration 5b, once runs/iter5a/best.pt exists:
#   model_type: hybrid
#   branch_kind: wavelet
#   vit_checkpoint: runs/iter5a/best.pt

seed: 2026
validation_fraction: 0.12

batch_size: 16
epochs: 10
learning_rate: 0.00002
weight_decay: 0.01
# data_source: local reads a materialized folder rather than re-fetching HF
# shards per epoch, so the streamed-source caveat about num_workers=0
# (detector/data_sources/local.py never had that constraint; it only
# applied to sid_set_stream.py/dragon.py's in-process shard cache) does not
# apply here. Kept modest rather than matching the teammate's 8, since this
# project's own earlier benchmark (num_workers 0 vs 4 vs 16 on this same
# machine) found diminishing and eventually negative returns past a few
# workers on Windows spawn overhead; re-benchmark if epoch time is the
# bottleneck once crop_from_native's heavier per-image decode is measured.
num_workers: 4

# iter5_data/train is smaller than the teammate's ~61k iter4_train (SID_Set
# full_synthetic + DRAGON 17-of-25 + GenImage ADM/GLIDE, no CF-Small) --
# samples_per_epoch left unset so every epoch sees the whole pool rather
# than a fixed-size draw tuned for their larger corpus.

train_augment_probability: 0.8

# --- preprocessing / SAFE augmentations (slide 10) ---
crop_from_native: true
safe_augment: true

# --- objective alignment (experiments.md 9c-9h) ---
select_metric: roc_auc
loss_pos_weight: 1.0
balance_classes: true
lr_schedule: cosine
warmup_frac: 0.1
threshold: auto

pretrained: true
local_files_only: false
